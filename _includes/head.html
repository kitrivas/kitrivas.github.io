<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ page.title_full | default: site.title }}</title>
<meta property="og:title" content="{{ page.og_title | default: site.title }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:image" content="{{ page.og_image | default: 'https://kitrivas.com/the-resonance-war/images/og-image.jpg' }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:type" content="{{ page.og_type | default: 'website' }}">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="{{ site.google_fonts }}" rel="stylesheet">
<link rel="stylesheet" href="{{ '/css/site.css' | relative_url }}">
