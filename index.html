---
layout: default
---
<main>
  <div class="content">
    <h1 class="author-name">Kit Rivas</h1>
    <p class="author-line">Epic fantasy. Myth made modern.</p>
    <div class="rule"></div>
    <div class="works">
      <div class="works-label">Works</div>
      {% for work in site.data.works %}
      <a href="{{ work.url }}" class="work-card">
        <div class="work-title">{{ work.title }}</div>
        <div class="work-type">{{ work.type }}</div>
        <div class="work-desc">{{ work.desc }}</div>
        <span class="work-arrow">&rarr;</span>
      </a>
      {% endfor %}
    </div>
    <div class="newsletter">
      <div class="newsletter-label">Stay informed</div>
      <form action="https://buttondown.com/api/emails/embed-subscribe/kitrivas" method="post" class="newsletter-row">
        <input type="email" name="email" placeholder="your@email.com" required>
        <button type="submit">Subscribe</button>
      </form>
    </div>
  </div>
</main>
